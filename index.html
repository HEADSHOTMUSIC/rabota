<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Мой график</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171a;--mu:#6b7280;--ac:#2563eb;--ok:#16a34a;--rest:#0891b2;--duty:#d97706;--sh:#7c3aed;--bd:#e5e7eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d23;--tx:#f1f3f5;--mu:#9aa3af;--bd:#2a2f38}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d23;--tx:#f1f3f5;--mu:#9aa3af;--bd:#2a2f38}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:520px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 6px}
label:first-child{margin-top:0}
input{width:100%;font-size:18px;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button{font-size:16px;font-weight:600;padding:14px 6px;border:2px solid transparent;border-radius:12px;color:#fff;cursor:pointer;width:100%}
.w{background:var(--ok)}.r{background:var(--rest)}.d{background:var(--duty)}.s{background:var(--sh)}.p{background:var(--ac)}.x2{background:#dc2626}
button.on{border-color:var(--tx)}
.cur{margin-top:10px;font-size:15px;color:var(--mu)}.cur b{color:var(--tx)}
.big{font-size:20px;font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{width:48px;padding:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid div{background:var(--bg);border-radius:10px;padding:10px;font-size:18px}
.grid small{display:block;color:var(--mu);font-size:12px}
.li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px;gap:6px}
.li:last-child{border:0}
.li span:last-child{font-weight:700;white-space:nowrap}
.x{background:none;color:var(--mu);width:auto;padding:2px 10px;font-size:18px;border:0}
.hint{font-size:12px;color:var(--mu);margin-top:8px}
summary{font-weight:600;cursor:pointer}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;color:#fff;margin-left:4px}
</style>
<style>
body{background:linear-gradient(180deg,rgba(37,99,235,.16),transparent 300px),var(--bg);-webkit-tap-highlight-color:transparent;padding-bottom:48px}
body>.nav{padding:6px 2px 14px}
body>.nav h1{font-size:26px;font-weight:800;letter-spacing:-.4px}
.card{border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.08);border:1px solid var(--bd)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{box-shadow:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"] .card{box-shadow:0 8px 24px rgba(0,0,0,.35)}
label{font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--mu)}
input,textarea{border-radius:14px;border:1.5px solid var(--bd);padding:13px;font-weight:600;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px rgba(37,99,235,.18)}
button{border-radius:14px;transition:transform .1s,box-shadow .15s}
button:active{transform:scale(.96)}
.w,.r,.d,.s,.p,.x2{box-shadow:0 6px 14px rgba(0,0,0,.18)}
.w{background:linear-gradient(135deg,#22c55e,#15803d)}
.r{background:linear-gradient(135deg,#22d3ee,#0e7490)}
.d{background:linear-gradient(135deg,#fbbf24,#b45309)}
.s{background:linear-gradient(135deg,#a78bfa,#6d28d9)}
.p{background:linear-gradient(135deg,#60a5fa,#1d4ed8)}
.x2{background:linear-gradient(135deg,#f87171,#b91c1c)}
button.on{border-color:transparent;box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--tx)}
.nav button{box-shadow:none;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px}
.x{box-shadow:none;background:none}
.cur{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:12px}
#mt{font-size:21px;font-weight:800;text-transform:capitalize}
.grid{gap:10px;margin-top:14px}
.grid div{border-radius:16px;padding:13px;font-size:21px;font-weight:800}
.grid small{font-size:12px;font-weight:500;color:var(--mu);margin-bottom:3px}
.grid div:nth-child(3){grid-column:1/-1;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:30px}
.grid div:nth-child(3) small{color:rgba(255,255,255,.8)}
.li{padding:11px 0;font-size:15px}
.tag{border-radius:999px;padding:3px 10px;font-weight:600}
summary{font-size:16px;padding:4px 0}
.hint{line-height:1.45}
body{display:flex;flex-direction:column;padding-bottom:110px}
[data-v]{display:none}
body[data-tab="today"] [data-v="today"],body[data-tab="month"] [data-v="month"],body[data-tab="more"] [data-v="more"]{display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs button{flex:1;background:none;color:var(--mu);box-shadow:none;border-radius:12px;padding:6px 2px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:21px;line-height:1}
.tabs button.on{box-shadow:none;border-color:transparent;color:var(--ac)}
</style>
</head>
<body>
<div class="nav"><h1 style="margin:4px 0">📅 Мой график</h1><button onclick="toggleTheme()" style="width:auto;padding:8px 14px;background:var(--card);color:var(--tx);border:1px solid var(--bd)">☀️ / 🌙</button></div>

<div class="card" data-v="today" style="order:1">
  <div id="dayhead" style="font-size:20px;font-weight:800"></div>
  <div id="daybig" style="margin-top:10px"></div>
  <div class="grid" id="daygrid"></div>
</div>

<div class="card" data-v="today" style="order:2">
  <label for="date">Дата</label>
  <input type="date" id="date">
  <div class="g2">
    <button class="w" id="b_work" onclick="setStatus('work')">💼 Работал</button>
    <button class="r" id="b_rest" onclick="setStatus('rest')">🌴 Отдых</button>
    <button class="d" id="b_duty" onclick="setStatus('duty')">🚨 Дежурный</button>
    <button class="s" id="b_short" onclick="setStatus('short')">⏱ Короткий день</button>
  </div>
  <label for="hrs">Часов в этот день</label>
  <input type="text" inputmode="decimal" id="hrs" placeholder="Сначала выбери кнопку">
  <div class="g2"><button class="p" onclick="saveHours()">✔ Сохранить часы</button><button class="x2" onclick="delDay()">🗑 Удалить день</button></div>
  <div class="hint" id="msg"></div>
  <div class="cur">Этот день: <b id="cur"></b></div>
</div>

<div class="card" data-v="month" style="order:2">
  <label for="amt">Зарплата (сколько получил)</label>
  <input type="text" inputmode="decimal" id="amt" placeholder="Например 150000">
  <div class="hint">Запишется за месяц: <b id="paymo"></b>. Чтобы выбрать другой месяц, нажми стрелку ‹ или › в блоке с итогами выше.</div>
  <div class="g2" style="grid-template-columns:1fr"><button class="p" onclick="addPay()">💰 Записать</button></div>
</div>

<div class="card" data-v="month" style="order:1">
  <div class="nav">
    <button onclick="mv(-1)">‹</button>
    <div class="big" id="mt"></div>
    <button onclick="mv(1)">›</button>
  </div>
  <div class="grid">
    <div><small>Работал дней</small><b id="s_days"></b></div>
    <div><small>Всего часов</small><b id="s_hrs"></b></div>
    <div><small>Получил всего</small><b id="s_tot"></b></div>
    <div><small>За 1 час</small><b id="s_rate"></b></div>
    <div><small>В среднем за день</small><b id="s_avg"></b></div>
    <div><small>Дежурных / коротких / отдых</small><b id="s_x"></b></div>
  </div>
  <div class="hint" id="rnote"></div>
  <div id="cmp" style="margin-top:8px;font-size:15px;font-weight:700"></div>
</div>

<div class="card" data-v="month" style="order:4">
  <label>По дням (часы и сколько заработал)</label>
  <div id="list"></div>
</div>

<div class="card" data-v="month" style="order:3">
  <label>Выплаты за месяц</label>
  <div id="pays"></div>
</div>

<div class="card" data-v="more" style="order:1">
  <details>
    <summary>⚙️ Настройки</summary>
    <label for="set_work">Часов в рабочий день</label><input type="text" inputmode="decimal" id="set_work">
    <label for="set_duty">Часов в дежурный день</label><input type="text" inputmode="decimal" id="set_duty">
    <label for="set_short">Часов в короткий день</label><input type="text" inputmode="decimal" id="set_short">
    <label for="set_rate">Моя ставка за час (если пусто, считается из полученной зарплаты)</label><input type="text" inputmode="decimal" id="set_rate">
    <div class="g2" style="grid-template-columns:1fr"><button class="p" onclick="saveSettings(this)">✔ Сохранить настройки</button></div>
  </details>
</div>
<div class="card" data-v="more" style="order:2">
  <label>💾 Резервная копия (для нового телефона)</label>
  <textarea id="bk" placeholder="Здесь появится текст копии. Для загрузки вставь сюда текст копии." style="width:100%;min-height:90px;font-size:13px;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"></textarea>
  <div class="g2"><button class="p" onclick="makeBackup()">📋 Сохранить копию</button><button class="w" onclick="loadBackup()">⬇ Загрузить копию</button></div>
  <div class="hint" id="bkmsg"></div>
</div>
<div class="hint" style="order:9;text-align:center">Данные хранятся в этом телефоне, в этом браузере.</div>
<nav class="tabs">
  <button id="nt_today" class="on" onclick="showTab('today')"><span>📅</span>Сегодня</button>
  <button id="nt_month" onclick="showTab('month')"><span>📊</span>Месяц</button>
  <button id="nt_more" onclick="showTab('more')"><span>⚙️</span>Ещё</button>
</nav>

<script>
const KEY='workLog.v2';
let db={days:{},pay:[],sales:[],set:{work:9,duty:9,short:6,rate:0}};
function hoursFor(s){return s==='rest'?0:(Number(db.set[s])||0);}
try{
  const s=localStorage.getItem(KEY)||localStorage.getItem('workLog.v1');
  if(s){
    const o=JSON.parse(s);
    db.pay=o.pay||[];db.sales=o.sales||[];db.set=Object.assign(db.set,o.set||{});
    Object.keys(o.days||{}).forEach(k=>{const v=o.days[k];db.days[k]=typeof v==='string'?{s:v,h:hoursFor(v)}:v;});
  }
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
const N={work:'Работа',rest:'Отдых',duty:'Дежурный',short:'Короткий день'};
const C={work:'#16a34a',rest:'#0891b2',duty:'#d97706',short:'#7c3aed'};
function fmt(x){return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function num(v){return parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0;}
let vm=todayStr().slice(0,7);

function setStatus(s){db.days[$('date').value]={s:s,h:hoursFor(s)};save();render();}
function addPay(){const v=num($('amt').value);if(!v)return;db.pay.push({d:$('date').value,m:vm,a:v});$('amt').value='';save();render();}
function delPay(i){db.pay.splice(i,1);save();render();}
function flash(t){$('msg').textContent=t;setTimeout(()=>{$('msg').textContent='';},2500);}
function saveHours(){const d=$('date').value,x=db.days[d];if(!x){flash('Сначала выбери кнопку: Работал, Отдых и т.д.');return;}x.h=Math.min(24,Math.max(0,num($('hrs').value)));save();render();flash('Сохранено ✓');}
function delDay(){const d=$('date').value;if(!db.days[d]){flash('В этот день нет записи');return;}delete db.days[d];save();render();flash('День удалён');}
function saveSettings(b){['work','duty','short'].forEach(k=>{db.set[k]=num($('set_'+k).value);});db.set.rate=num($('set_rate').value);save();render();const t=b.textContent;b.textContent='Сохранено ✓';setTimeout(()=>{b.textContent=t;},2000);}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=c==='dark'?'light':'dark';applyTheme(n);try{localStorage.setItem('theme.v1',n);}catch(e){}}
try{const t=localStorage.getItem('theme.v1');if(t)applyTheme(t);}catch(e){}
function makeBackup(){
  const t=JSON.stringify({v:2,days:db.days,pay:db.pay,sales:db.sales,set:db.set});
  $('bk').value=t;
  let ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);ok=true;}}catch(e){}
  $('bkmsg').textContent=ok?'Копия скопирована. Вставь её в заметку или отправь себе в Телеграм.':'Нажми на текст выше, выбери «Выбрать всё» и «Копировать».';
}
function loadBackup(){
  let o;
  try{o=JSON.parse($('bk').value.trim());}catch(e){$('bkmsg').textContent='Не получилось прочитать. Вставь копию целиком.';return;}
  if(!o||typeof o.days!=='object'){$('bkmsg').textContent='Это не копия графика.';return;}
  let nd=0,np=0,ns=0;
  Object.keys(o.days).forEach(k=>{const x=o.days[k];if(x&&typeof x==='object'&&N[x.s]){db.days[k]={s:x.s,h:Number(x.h)||0};nd++;}});
  (o.pay||[]).forEach(p=>{
    if(!p||!p.d||!(Number(p.a)>0))return;
    const m=p.m||String(p.d).slice(0,7),a=Number(p.a);
    if(!db.pay.some(q=>q.d===p.d&&(q.m||q.d.slice(0,7))===m&&q.a===a)){db.pay.push({d:p.d,m:m,a:a});np++;}
  });
  (o.sales||[]).forEach(x=>{if(!x||!x.id||!x.d||!(Number(x.s)>0))return;if(!db.sales.some(y=>y.id===x.id)){db.sales.push({id:x.id,d:x.d,m:x.m||String(x.d).slice(0,7),name:String(x.name||'Продажа'),q:Number(x.q)||1,s:Number(x.s),c:Number(x.c)||0});ns++;}});
  if(o.set&&typeof o.set==='object'){['work','duty','short','rate'].forEach(k=>{if(o.set[k]!==undefined)db.set[k]=Number(o.set[k])||0;});}
  save();
  ['work','duty','short'].forEach(k=>{$('set_'+k).value=db.set[k];});$('set_rate').value=db.set.rate||'';
  render();
  $('bkmsg').textContent='Загружено: дней '+nd+', выплат '+np+', продаж '+ns+' ✓';
}
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function addSale(){
  const name=$('sl_name').value.trim()||'Продажа';
  const q=num($('sl_q').value)||1,s=num($('sl_s').value),c=num($('sl_c').value);
  if(!s){$('slmsg').textContent='Впиши, на какую сумму продал.';return;}
  db.sales.push({id:Date.now(),d:$('date').value,m:vm,name:name,q:q,s:s,c:c});
  ['sl_name','sl_q','sl_s','sl_c'].forEach(i=>{$(i).value='';});
  $('slmsg').textContent='Записано ✓';save();render();
}
function delSale(id){db.sales=db.sales.filter(x=>x.id!==id);save();render();}
function renderSales(){
  const L=db.sales.filter(x=>(x.m||x.d.slice(0,7))===vm).sort((a,b)=>a.d<b.d?-1:1);
  let q=0,s=0,c=0;L.forEach(x=>{q+=x.q;s+=x.s;c+=x.c;});
  $('slmo').textContent=new Date(vm+'-01T00:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  $('sl_grid').innerHTML='<div><small>Продаж, раз</small>'+(Math.round(q*10)/10)+'</div><div><small>Продал на сумму</small>'+fmt(s)+'</div><div><small>Заработал с продаж</small>'+fmt(s-c)+'</div><div><small>Закупка</small>'+fmt(c)+'</div>';
  $('sl_list').innerHTML=L.length?L.map(x=>'<div class="li"><span>'+x.d.slice(8)+'.'+x.d.slice(5,7)+' продал <b>'+fmt(x.s)+'</b></span><span>+'+fmt(x.s-x.c)+'<button class="x" onclick="delSale('+x.id+')">✕</button></span></div>').join(''):'<div class="hint">Пока нет продаж</div>';
}
function showTab(t){document.body.setAttribute('data-tab',t);['today','month','more'].forEach(k=>{$('nt_'+k).classList.toggle('on',k===t);});window.scrollTo(0,0);}
function monthRate(m){let hrs=0,total=0;Object.keys(db.days).forEach(k=>{if(k.startsWith(m)){const x=db.days[k];if(x.s!=='rest')hrs+=x.h;}});db.pay.forEach(p=>{if((p.m||p.d.slice(0,7))===m)total+=p.a;});return db.set.rate>0?db.set.rate:(hrs?total/hrs:0);}
function renderDay(){
  const d=$('date').value||todayStr(),x=db.days[d];
  const nm=new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  $('dayhead').textContent=(d===todayStr()?'Сегодня · ':'')+nm;
  const h=x?x.h:0,rate=monthRate(d.slice(0,7));
  $('daybig').innerHTML=x?'<span class="tag" style="background:'+C[x.s]+';font-size:15px;padding:5px 14px">'+N[x.s]+'</span>':'<span class="hint">День не отмечен. Нажми кнопку ниже.</span>';
  $('daygrid').innerHTML='<div><small>Часов</small>'+(Math.round(h*10)/10)+'</div><div><small>Ставка за час</small>'+fmt(rate)+'</div><div><small>Заработал за день</small>'+fmt(h*rate)+'</div>';
}
function payOf(m){let t=0;db.pay.forEach(p=>{if((p.m||p.d.slice(0,7))===m)t+=p.a;});return t;}
function renderCmp(){
  const p=vm.split('-').map(Number),pd=new Date(p[0],p[1]-2,1),pm=pd.getFullYear()+'-'+pad(pd.getMonth()+1);
  const cur=payOf(vm),prev=payOf(pm),nm=pd.toLocaleDateString('ru-RU',{month:'long'}),el=$('cmp');
  if(!prev){el.style.color='var(--mu)';el.textContent='Зарплата за прошлый месяц ('+nm+') не записана, сравнивать не с чем.';return;}
  const pct=Math.round((cur-prev)/prev*100),up=cur>=prev;
  el.style.color=up?'#16a34a':'#dc2626';
  el.textContent=(up?'▲ ':'▼ ')+Math.abs(pct)+'% к прошлому месяцу ('+nm+'): было '+fmt(prev)+', стало '+fmt(cur);
}
function mv(n){const p=vm.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);vm=d.getFullYear()+'-'+pad(d.getMonth()+1);render();}

$('date').addEventListener('change',()=>{vm=$('date').value.slice(0,7);render();});
$('hrs').addEventListener('change',()=>{const d=$('date').value,x=db.days[d];if(x){x.h=Math.min(24,Math.max(0,num($('hrs').value)));save();render();}});
['work','duty','short'].forEach(k=>$('set_'+k).addEventListener('change',()=>{db.set[k]=num($('set_'+k).value);save();}));
$('set_rate').addEventListener('change',()=>{db.set.rate=num($('set_rate').value);save();render();});

function render(){renderDay();renderCmp();
  const d=$('date').value||todayStr(),cur=db.days[d];
  $('cur').textContent=cur?N[cur.s]:'не отмечено';
  ['work','rest','duty','short'].forEach(k=>$('b_'+k).classList.toggle('on',!!cur&&cur.s===k));
  $('hrs').value=cur?cur.h:'';$('hrs').disabled=!cur;
  const keys=Object.keys(db.days).filter(k=>k.startsWith(vm)).sort();
  let hrs=0,wd=0,du=0,sh=0,rs=0;
  keys.forEach(k=>{const x=db.days[k];if(x.s==='rest'){rs++;return;}wd++;hrs+=x.h;if(x.s==='duty')du++;if(x.s==='short')sh++;});
  const pays=db.pay.map((p,i)=>({d:p.d,m:p.m||p.d.slice(0,7),a:p.a,i:i})).filter(p=>p.m===vm).sort((a,b)=>a.d<b.d?-1:1);
  const total=pays.reduce((s,p)=>s+p.a,0);
  const own=db.set.rate>0;
  const rate=own?db.set.rate:(hrs?total/hrs:0);
  const mn=new Date(vm+'-01T00:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});$('mt').textContent=mn;$('paymo').textContent=mn;
  $('s_days').textContent=wd;$('s_hrs').textContent=(Math.round(hrs*10)/10);
  $('s_tot').textContent=fmt(total);$('s_rate').textContent=fmt(rate);
  $('s_avg').textContent=wd?fmt(total/wd):'0';
  $('s_x').textContent=du+' / '+sh+' / '+rs;
  $('rnote').textContent=(own?'Заработок по дням считается по твоей ставке.':'Ставка за час = полученная зарплата ÷ часы за месяц.')+' Суммы по дням округлены до целых, поэтому их сумма может отличаться от итога на несколько единиц. Итог всегда точный.';
  $('list').innerHTML=keys.length?keys.map(k=>{
    const x=db.days[k],wk=new Date(k+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'short'});
    return '<div class="li"><span>'+k.slice(8)+'.'+k.slice(5,7)+' '+wk+'<span class="tag" style="background:'+C[x.s]+'">'+N[x.s]+'</span></span><span>'+(x.s==='rest'?'—':(x.h+' ч · '+fmt(x.h*rate)))+'</span></div>';
  }).join(''):'<div class="hint">Пока нет отметок</div>';
  $('pays').innerHTML=pays.length?pays.map(p=>'<div class="li"><span>'+p.d.slice(8)+'.'+p.d.slice(5,7)+'</span><span>'+fmt(p.a)+'<button class="x" onclick="delPay('+p.i+')">✕</button></span></div>').join(''):'<div class="hint">Пока нет записей</div>';
}
(function(){
  let done=false;try{done=localStorage.getItem('seed.sep2026')==='1';}catch(e){}
  if(done)return;
  const S=[9,9,9,9,9,6,9,9,9,9,9,9,9,9,0,9,9,9,9,9,9,9,9,9,9,9,6,9,9,9];
  S.forEach((h,i)=>{
    const k='2026-09-'+pad(i+1);if(db.days[k])return;
    const wd=new Date(k+'T00:00:00').getDay();
    db.days[k]=h===0?{s:'rest',h:0}:(wd===0?{s:(h<9?'short':'duty'),h:h}:{s:'work',h:h});
  });
  if(!db.days['2026-10-11'])db.days['2026-10-11']={s:'duty',h:9};
  save();try{localStorage.setItem('seed.sep2026','1');}catch(e){}
})();
$('date').value=todayStr();
['work','duty','short'].forEach(k=>$('set_'+k).value=db.set[k]);
$('set_rate').value=db.set.rate||'';
render();
showTab('today');
</script>
